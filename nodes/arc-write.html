<script type="text/javascript">
  RED.nodes.registerType('arc-write', {
    category: 'storage',
    color: '#5bc0de',
    defaults: {
      name: { value: '' },
      server: { type: 'arc-server', required: true },
      database: { value: '', validate: RED.validators.regex(/^([A-Za-z][A-Za-z0-9_-]{0,63})?$/) },
      measurement: { value: '', validate: RED.validators.regex(/^([a-zA-Z][a-zA-Z0-9_-]{0,127})?$/) },
      precision: { value: 'ms' },
      integerColumns: { value: '' },
      onTypeMismatch: { value: 'null' },
      stringifyObjects: { value: false },
      sanitizeNames: { value: false },
      batchSize: { value: 5000, validate: RED.validators.number() },
      flushInterval: { value: 1000, validate: RED.validators.number() },
      maxBufferRows: { value: 200000, validate: RED.validators.number() },
      maxBufferMB: { value: 64, validate: RED.validators.number() },
      maxPendingMessages: { value: 100000, validate: RED.validators.number() },
      maxInFlight: { value: 4, validate: RED.validators.number() },
      overflow: { value: 'drop-oldest' },
      outputs: { value: 0 },
    },
    inputs: 1,
    outputs: 0,
    icon: 'db.svg',
    align: 'right',
    label: function () {
      return this.name || (this.measurement ? 'arc ' + this.measurement : 'arc write');
    },
    paletteLabel: 'arc write',
    oneditprepare: function () {
      $('#node-input-resultsOutput').prop('checked', Number(this.outputs) > 0);
    },
    oneditsave: function () {
      this.outputs = $('#node-input-resultsOutput').prop('checked') ? 1 : 0;
    },
  });
</script>

  <div class="form-row">
    <label for="node-input-maxBufferRows"><i class="fa fa-inbox"></i> Buffer cap</label>
    <input type="text" id="node-input-maxBufferRows" style="width:90px"> rows,
    <input type="text" id="node-input-maxBufferMB" style="width:60px"> MB
  </div>
  <div class="form-row">
    <label for="node-input-maxPendingMessages"><i class="fa fa-envelope"></i> Pending msgs</label>
    <input type="text" id="node-input-maxPendingMessages" style="width:90px">
  </div>
  <div class="form-row">
    <label for="node-input-maxInFlight"><i class="fa fa-plane"></i> In flight</label>
    <input type="text" id="node-input-maxInFlight" style="width:90px"> requests
  </div>
  <div class="form-row">
    <label for="node-input-overflow"><i class="fa fa-trash"></i> When full</label>
    <select id="node-input-overflow">
      <option value="drop-oldest">drop the oldest rows</option>
      <option value="reject-new">reject new messages</option>
    </select>
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-resultsOutput" style="width:auto"> Output one message per batch sent
  </div>
</script>

<script type="text/markdown" data-help-name="arc-write">
Writes rows to Arc as MessagePack, batched and buffered.

### Inputs

: payload (object | array | number) : One row (`{temperature: 21.5, sensor: "a1"}`), an array of rows, `{rows: [...]}`, `{columns: {...}}` (equal-length arrays), or a number (stored in column `value`).
: measurement (string) : Overrides the node's measurement.
: database (string) : Overrides the node's and server's database.
: time (Date | number | string | BigInt) : Time for the row(s), unless a row has its own `time`. Numbers use the node's time unit; strings are ISO 8601 (UTC without an offset) or digits. Missing means "now".
: precision (string) : Overrides the time unit (`s`, `ms`, `us`, `ns`) for this message.
: flush (boolean) : `true` sends everything buffered now.

### Outputs

Optional. With *Output one message per batch sent*, each batch produces `msg.payload = {database, measurement, rows, status, reason, durationMs, action}`.

### Details

Every value is a column; there are no tags or fields. A message is finished (`done`) only after Arc answers **204** for all of its rows, so Complete nodes fire once Arc has accepted the data, up to one flush interval later. How durable that is depends on Arc's write-ahead log settings.

**Types.** Every number is written as a floating-point value, even `21`, so a sensor that sends `21` and then `21.7` keeps one numeric column. List columns under *Integer columns* to store them as integers, or send a `BigInt`. This node fixes each column's type from the first value it sends; a later value of another type leaves that cell empty (or rejects the message) and is listed in `msg.arc.rejectedCells`. The type is remembered per node and forgotten on redeploy, so set *Integer columns* before the first write: changing it later stores the same column as decimal in some files and integer in others.

**Names.** Database and measurement names must start with a letter and use only letters, digits, `_` and `-`. Column names must not start with `_` or be `time` in another case. Arc treats names differing only in A–Z case as one column; the first spelling seen is kept and other spellings are rejected. Invalid messages are rejected immediately, so they never block other rows.

**Failures.** A message that could not be written reaches Catch nodes with its payload untouched and `msg.arc` describing why. The node resends only when Arc confirms nothing was stored (Arc 27.01.1 and later mark these answers). Anything else — including any error from earlier Arc releases — is reported, never resent, so the node never writes a row twice. A flow that resends from Catch can; use `msg.arc.written` to skip rows Arc already has. A rejected token pauses the node until the token works again.

**Buffer.** Rows wait in memory until sent. When the buffer is full, the oldest message is dropped (or new messages are rejected) and fails. `msg.arc.written` counts rows of a failed message that Arc had already stored (a message larger than one batch). Size the buffer as rows per second × the longest outage you want to survive. Rows still buffered when the flow is stopped fail after the close timeout.
</script>
